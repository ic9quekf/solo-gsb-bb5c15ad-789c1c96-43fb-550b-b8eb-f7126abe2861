services:
  trace-api:
    build: .
    image: food-batch-trace-api:latest
    container_name: food-batch-trace-api
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # SQLite 数据库文件位置（容器内），默认无需修改
      TRACE_DB_PATH: /data/trace.db
      PORT: "8000"
    volumes:
      - trace-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3; c=sqlite3.connect(os.environ['TRACE_DB_PATH']); c.execute('SELECT 1'); c.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  trace-data:
